<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Camera</title>

  <!-- CSS -->
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>

  <video id="camera" autoplay playsinline muted></video>
  <button id="start">Start Camera</button>
  
  <!-- Speech recording controls (hidden initially) -->
  <div id="speech-controls" class="speech-controls hidden">
    <div id="transcription" class="transcription hidden"></div>
    <div class="button-group">
      <button id="record-btn">Start Recording</button>
      <button id="stop-btn" class="hidden">Stop & Transcribe</button>
      <button id="random-signs-btn">Random ASL Sequence</button>
    </div>
  </div>

  <!-- JS (loaded after elements exist) -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
